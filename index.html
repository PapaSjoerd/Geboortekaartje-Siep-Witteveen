<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f2e7">
<title>Siep — I got life</title>
<style>
:root{--paper:#f7f2e7;--ink:#102d45;--blue:#4389ad}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 36px;text-align:center}
.art{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;object-position:center top}
h1{font-size:clamp(54px,14vw,82px);font-weight:normal;line-height:.95;color:var(--blue);margin:4px 0 8px}
.tagline{font-size:clamp(24px,6vw,34px);letter-spacing:.03em;margin:0 0 22px}
button{font:600 16px Arial,sans-serif;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:16px 24px;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
#status{font:14px/1.5 Arial,sans-serif;min-height:42px;color:#4f5f67;margin:16px auto 8px;max-width:360px}
#player{width:100%;margin:10px auto 0}
.note{font:12px/1.5 Arial,sans-serif;color:#66716e;margin-top:18px}
@media(min-width:600px){main{padding-top:28px}.art{max-height:650px}}
</style>
</head>
<body>
<main>
  <img class="art" src="./siep-illustratie.png" alt="Illustratie van een baby in een hangende wieg, een poes, een vogel en bloemen">
  <h1>Siep</h1>
  <p class="tagline">I got life</p>
  <button id="playButton" type="button">▶ Luister naar het liedje</button>
  <p id="status" role="status" aria-live="polite">Tik op de knop om het nummer vanaf 1:06 te starten.</p>
  <div id="player"></div>
  <p class="note">Een klein liedje, met heel veel liefde.</p>
</main>
<script>
const trackUrl = "https://open.spotify.com/track/0p9kp28VdoiuIxgzkzhZLU";
const startAtSeconds = 66;
const button = document.getElementById("playButton");
const statusEl = document.getElementById("status");
let controller = null;
let apiReady = false;

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  IFrameAPI.createController(document.getElementById("player"), {
    uri: "spotify:track:0p9kp28VdoiuIxgzkzhZLU",
    width: "100%",
    height: 152
  }, (embedController) => {
    controller = embedController;
    apiReady = true;
    controller.addListener("ready", () => {
      statusEl.textContent = "Klaar om te luisteren. Tik op de knop om te beginnen.";
    });
    controller.addListener("playback_started", () => {
      statusEl.textContent = "Veel luisterplezier ♡";
    });
    controller.loadUri("spotify:track:0p9kp28VdoiuIxgzkzhZLU", { startAt: startAtSeconds });
  });
};

button.addEventListener("click", () => {
  if (!apiReady || !controller) {
    statusEl.textContent = "De Spotify-speler wordt nog geladen. Probeer het zo nog eens.";
    return;
  }
  statusEl.textContent = "We proberen het nummer vanaf 1:06 te starten…";
  // Spotify's iframe player may enforce its own playback and seek limitations.
  controller.loadUri("spotify:track:0p9kp28VdoiuIxgzkzhZLU", { startAt: startAtSeconds });
  controller.play();
});

const script = document.createElement("script");
script.src = "https://open.spotify.com/embed/iframe-api/v1";
script.async = true;
document.head.appendChild(script);
</script>
</body>
</html>
