<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f5ed">
<title>Siep — I got life</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5ed;font-family:Arial,sans-serif}
main{width:min(100%,1000px);margin:0 auto;padding:0 0 22px;text-align:center}
.hero{position:relative;width:100%;line-height:0}
.hero img{display:block;width:100%;height:auto}
#playButton{position:absolute;left:36.4%;top:54.8%;width:27.2%;height:8.1%;border:0;border-radius:999px;background:transparent;cursor:pointer;color:transparent}
#playButton:focus-visible{outline:3px solid #2d4329;outline-offset:3px}
#status{min-height:24px;padding:0 16px;margin:10px auto 8px;color:#52604e;font:14px/1.5 Arial,sans-serif}
#player{width:min(100% - 28px,360px);margin:0 auto}
.hint{font:12px/1.5 Arial,sans-serif;color:#6b7568;margin:10px 14px 0}
@media(max-width:480px){#status{font-size:13px}}
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="./siep-webpagina.png" alt="Siep — I got life, met een waterverfillustratie van een kindje in een weiland met een voetbal en een knop om naar het liedje te luisteren">
    <button id="playButton" type="button" aria-label="Luister naar het liedje vanaf 1 minuut en 6 seconden">Luister naar het liedje</button>
  </div>
  <p id="status" role="status" aria-live="polite">Tik op de knop in de afbeelding om het nummer vanaf 1:06 te starten.</p>
  <div id="player"></div>
  <p class="hint">Als Spotify niet automatisch op 1:06 begint, controleer dan de tijd in de speler.</p>
</main>
<script>
const trackUrl = "https://open.spotify.com/track/0p9kp28VdoiuIxgzkzhZLU";
const trackUri = "spotify:track:0p9kp28VdoiuIxgzkzhZLU";
const startAtSeconds = 66;
const button = document.getElementById("playButton");
const statusEl = document.getElementById("status");
let controller = null;
let apiReady = false;

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  IFrameAPI.createController(document.getElementById("player"), {
    uri: trackUri,
    width: "100%",
    height: 152
  }, (embedController) => {
    controller = embedController;
    apiReady = true;
    controller.addListener("ready", () => {
      statusEl.textContent = "Klaar om te luisteren. Tik op de knop in de afbeelding.";
    });
    controller.addListener("playback_started", () => {
      statusEl.textContent = "Veel luisterplezier ♡";
    });
  });
};

button.addEventListener("click", () => {
  if (!apiReady || !controller) {
    statusEl.textContent = "De Spotify-speler wordt nog geladen. Probeer het zo nog eens.";
    return;
  }
  statusEl.textContent = "We proberen het nummer vanaf 1:06 te starten…";
  controller.loadEntity(trackUrl, false, startAtSeconds);
  window.setTimeout(() => controller.play(), 500);
});

const script = document.createElement("script");
script.src = "https://open.spotify.com/embed/iframe-api/v1";
script.async = true;
document.head.appendChild(script);
</script>
</body>
</html>
